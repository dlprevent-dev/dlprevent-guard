# dlprevent-guard next to Hermes, in one file. On the Hermes host:
#
#   git clone <this repo> && cd dlprevent-guard/guard
#   echo GUARD_UPSTREAM=https://openrouter.ai/api > .env    # your provider
#   docker compose up -d --build
#
# Then point Hermes at http://127.0.0.1:8787/v1 instead of the provider;
# its API key stays in Hermes and passes through. Verdicts land in
# /var/log/dlprevent-guard/verdicts.jsonl, where the DLPrevent Linux agent
# (installed on the host, not in here — it watches the host kernel) picks
# them up as alerts.
services:
  guard:
    build:
      context: ..
      dockerfile: guard/Dockerfile
    image: dlprevent-guard:local
    restart: unless-stopped
    environment:
      GUARD_UPSTREAM: ${GUARD_UPSTREAM:?set GUARD_UPSTREAM to the model provider's base URL, e.g. https://openrouter.ai/api}
      # flag: report and forward. block: refuse what the rules call block.
      GUARD_MODE: ${GUARD_MODE:-flag}
      # The provider key, if the agent does not send it: Hermes treats a
      # 127.0.0.1 address as a local model server and sends the placeholder
      # "no-key-required". Keep .env readable by root only (chmod 600).
      GUARD_UPSTREAM_KEY: ${GUARD_UPSTREAM_KEY:-}
      # Optional: overrides of the engine settings, as JSON (see README).
      # GUARD_POLICY: /etc/dlprevent-guard/policy.json
    ports:
      # This host only: Hermes talks to it, nobody else should.
      - "127.0.0.1:${GUARD_PORT:-8787}:8787"
    volumes:
      - /var/log/dlprevent-guard:/var/log/dlprevent-guard
      # - ./policy.json:/etc/dlprevent-guard/policy.json:ro
    # Root inside, but with nothing to be root with: no capabilities, no
    # writable filesystem except the verdict log. Root only so the log
    # directory Docker creates on the host (root-owned) is writable.
    user: root
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # If Hermes runs in Docker too, it can live in this file:
  # hermes:
  #   image: <your hermes image>
  #   environment:
  #     OPENAI_BASE_URL: http://guard:8787/v1
  #   volumes:
  #     - /root/.hermes:/root/.hermes   # the DLPrevent agent reads the session logs here
