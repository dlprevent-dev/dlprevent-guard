name: Bug report
description: Something does not work as described
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Security issues, including a way to get a prompt or data past the guard, do not belong here. Send them to security@dlprevent.ch.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: How the guard runs, and which agent and model provider sit on either side.
      placeholder: Docker compose, Hermes, OpenAI-compatible provider
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For example a request that was blocked but should pass, or the other way round.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The request or prompt that triggers it. Remove secrets and personal data first.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Guard container log around the time it happened.
      render: text
