name: Feature request
description: Something the guard should do that it does not yet
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Security issues, including a way to get a prompt or data past the guard, do not belong here. Send them to security@dlprevent.ch, see SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: The situation and what gets in the way today — not yet the solution.
      placeholder: My agent talks to a provider over an API the guard does not scan ...
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: How the guard runs, and which agent and model provider sit on either side.
      placeholder: Docker compose, Hermes, OpenAI-compatible provider
  - type: textarea
    id: idea
    attributes:
      label: How could the guard help?
      description: What you imagine, if you have an idea.
