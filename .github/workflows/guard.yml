# The guard's tests, AnveGuard's engine tests, and the container build.
name: guard

on:
  push:
    branches: [main, dev]
    paths: ["guard/**", "supabase/functions/_shared/**", ".github/workflows/guard.yml"]
  pull_request:
    branches: [main]

# Read only: once the repository is public, a pull request from a fork runs
# here too, and needs nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tests
        working-directory: guard
        run: deno test --allow-net --allow-read --allow-env
      - name: Engine tests
        working-directory: supabase/functions/_shared
        run: deno test --allow-net --allow-read --allow-env --no-check
      - name: Container builds
        run: docker build -q -f guard/Dockerfile -t dlprevent-guard:ci .
